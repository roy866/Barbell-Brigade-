name: Deploy to GitHub Pages

on:
  # Every push to main publishes the site.
  push:
    branches: [main]
  # ...and the Actions tab gets a "Run workflow" button for manual redeploys.
  workflow_dispatch:

# Lets the deploy job mint the token GitHub Pages needs.
permissions:
  contents: read
  pages: write
  id-token: write

# If two pushes land close together, let the newer one finish rather than
# cancelling it — a half-cancelled deploy would leave the site stale.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # enablement turns Pages on and points it at Actions via the API, so the
      # repo needs no manual Settings change. Without it this step fails on a
      # repo where Pages was never enabled.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # No build step — but the repo root holds docs and CI config that have no
      # business being served, so mirror everything except those into _site.
      # Exclusions rather than an allow-list, so new site files ship
      # automatically without anyone remembering to update this.
      - name: Stage the site
        run: |
          mkdir -p _site
          rsync -a \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.claude' \
            --exclude '_site' \
            --exclude 'README.md' \
            --exclude 'CLAUDE.md' \
            ./ _site/
          echo "Publishing:" && find _site -type f | sort

      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
