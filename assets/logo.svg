<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 48" width="96" height="48" role="img" aria-label="Barbell Brigade barbell logo">
  <!-- Literal fills, because a standalone SVG has no page to inherit tokens
       from. These have to track --text and --accent in styles.css by hand. -->
  <!-- bar — chalk -->
  <rect x="8" y="21" width="80" height="6" rx="3" fill="#F1EDE4"/>
  <!-- outer plates — 15kg yellow -->
  <rect x="14" y="8" width="9" height="32" rx="3" fill="#F5B72E"/>
  <rect x="73" y="8" width="9" height="32" rx="3" fill="#F5B72E"/>
  <!-- inner plates — chalk -->
  <rect x="26" y="14" width="7" height="20" rx="2.5" fill="#F1EDE4"/>
  <rect x="63" y="14" width="7" height="20" rx="2.5" fill="#F1EDE4"/>
</svg>
